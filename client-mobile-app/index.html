<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TrackNow Farmer Portal - Mobile App</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0d1a12;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      /* Mobile viewport frame simulation on desktop browsers */
      @media (min-width: 600px) {
        body {
          display: flex;
          align-items: center;
          justify-content: center;
          background: #060e0a;
        }
        #root {
          max-width: 440px;
          height: 92vh;
          max-height: 890px;
          box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 12px #1f2937;
          border-radius: 36px;
          overflow: hidden;
          position: relative;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
