# Netlify — SilkRoute Driver app
# Connect repo with Base directory: frontend-driver

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  VITE_API_URL = "https://tracknow-backend-api.onrender.com/api"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
